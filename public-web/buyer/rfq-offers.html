<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offers — Waradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-slot"></div>
    <main class="content">
      <div class="page-wide">
        <h1 class="page-title">Compare offers</h1>
        <p id="error" class="error-text mb-4" style="display:none;"></p>
        <div class="card" id="list">Loading…</div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    const rfqId = Waradly.qs('id');

    async function render() {
      const { offers } = await Waradly.api(`/api/rfqs/${rfqId}/offers`);
      document.getElementById('list').innerHTML = offers.length
        ? `<table><thead><tr><th>Supplier</th><th>Unit price</th><th>MOQ</th><th>Lead time</th><th>Delivery est.</th><th>Status</th><th></th></tr></thead><tbody>
            ${offers.map((o) => `<tr>
              <td>${Waradly.escapeHtml(o.supplier_anonymized_id)}</td>
              <td>$${o.unit_price}</td><td>${o.moq}</td><td>${o.production_lead_time_days}d</td><td>${o.delivery_time_estimate_days}d</td>
              <td><span class="badge">${o.status}</span></td>
              <td>${o.status === 'SUBMITTED' || o.status === 'UNDER_REVIEW' ? `<button class="btn-primary accept-btn" data-id="${o.id}">Accept</button>` : ''}</td>
            </tr>`).join('')}
          </tbody></table>`
        : '<p class="muted">No offers yet.</p>';

      document.querySelectorAll('.accept-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Accept this offer? This will reject all other offers and create an order.')) return;
          Waradly.clearError('error');
          try {
            const data = await Waradly.api(`/api/offers/${btn.dataset.id}/accept`, { method: 'PATCH' });
            window.location.assign(`/buyer/order-detail.html?id=${data.order_id}`);
          } catch (err) {
            Waradly.showError('error', err);
          }
        });
      });
    }

    (async () => {
      const user = await Waradly.requireRole('buyer');
      if (!user) return;
      Waradly.mountShell(user, '/buyer/rfqs.html');
      await render();
    })();
  </script>
</body>
</html>
