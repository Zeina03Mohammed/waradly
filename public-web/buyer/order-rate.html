<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rate order — Warradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/i18n.js"></script>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-slot"></div>
    <main class="content">
      <div class="page-wide" style="max-width:480px;">
        <h1 class="page-title">Rate this order</h1>
        <p id="error" class="error-text mb-4" style="display:none;"></p>
        <form id="form" class="card">
          <label class="field"><span>Score (1–5)</span><input class="input" type="number" id="score" min="1" max="5" required /></label>
          <label class="field"><span>Comment (optional)</span><textarea class="input" id="comment" rows="3"></textarea></label>
          <button class="btn-primary w-full" type="submit" id="submit-btn">Submit rating</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    const orderId = Warradly.qs('id');
    (async () => {
      const user = await Warradly.requireRole('buyer');
      if (!user) return;
      Warradly.mountShell(user, '/buyer/orders.html');
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      Warradly.clearError('error');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        await Warradly.api(`/api/orders/${orderId}/rate`, {
          method: 'POST',
          body: { score: Number(document.getElementById('score').value), comment: document.getElementById('comment').value || undefined },
        });
        window.location.assign(`/buyer/order-detail.html?id=${orderId}`);
      } catch (err) {
        Warradly.showError('error', err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
