<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Waradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">Forgot password</h1>
    <p id="success" class="success-text mb-4" style="display:none;">If an account exists for that email, a reset link has been sent.</p>
    <form id="form">
      <label class="field"><span>Email</span><input class="input" type="email" id="email" required /></label>
      <button class="btn-primary w-full" type="submit" id="submit-btn">Send reset link</button>
    </form>
    <p class="muted mt-4"><a href="/login.html">Back to login</a></p>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        await Waradly.api('/api/auth/password-reset-request', { method: 'POST', body: { email: document.getElementById('email').value } });
        document.getElementById('success').style.display = 'block';
        document.getElementById('form').style.display = 'none';
      } catch {
        document.getElementById('success').style.display = 'block';
        document.getElementById('form').style.display = 'none';
      }
    });
  </script>
</body>
</html>
