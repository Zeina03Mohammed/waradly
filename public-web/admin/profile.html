<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Waradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-slot"></div>
    <main class="content">
      <div class="page-wide" style="max-width:480px;">
        <h1 class="page-title">Profile</h1>
        <p id="error" class="error-text mb-4" style="display:none;"></p>
        <div class="card">
          <div class="flex items-center gap-4 mb-4">
            <img id="avatar-img" src="" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:none;" />
            <div id="avatar-initials" style="width:64px;height:64px;border-radius:50%;background:var(--navy-50);display:flex;align-items:center;justify-content:center;font-weight:600;"></div>
            <div>
              <input type="file" id="photo-input" accept="image/png,image/jpeg" style="display:none;" />
              <button class="btn-secondary" type="button" id="upload-photo-btn">Upload new photo</button>
            </div>
          </div>
          <label class="field"><span>Username</span><input class="input" id="username" /></label>
          <button class="btn-primary" id="save-username-btn" type="button">Save username</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    let currentUser = null;

    async function renderAvatar() {
      if (currentUser.has_avatar) {
        const img = document.getElementById('avatar-img');
        const ok = await Waradly.loadAvatarInto(img, currentUser.id);
        if (ok) {
          img.style.display = 'block';
          document.getElementById('avatar-initials').style.display = 'none';
          return;
        }
      }
      const label = currentUser.username || currentUser.email;
      document.getElementById('avatar-initials').textContent = label.slice(0, 2).toUpperCase();
    }

    (async () => {
      currentUser = await Waradly.requireRole('admin');
      if (!currentUser) return;
      Waradly.mountShell(currentUser, '/admin/profile.html');
      document.getElementById('username').value = currentUser.username || '';
      renderAvatar();
    })();

    document.getElementById('upload-photo-btn').addEventListener('click', () => document.getElementById('photo-input').click());
    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const formData = new FormData();
        formData.append('file', file);
        await Waradly.api('/api/users/me/avatar', { method: 'POST', body: formData, isFormData: true });
        currentUser.has_avatar = true;
        renderAvatar();
      } catch (err) {
        Waradly.showError('error', err);
      }
    });

    document.getElementById('save-username-btn').addEventListener('click', async () => {
      Waradly.clearError('error');
      try {
        await Waradly.api('/api/users/me', { method: 'PATCH', body: { username: document.getElementById('username').value } });
      } catch (err) {
        Waradly.showError('error', err);
      }
    });
  </script>
</body>
</html>
