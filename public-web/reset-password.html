<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reset password — Waradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
</head>
<body>
  <main class="page">
    <a class="auth-logo" href="/"><img src="/assets/img/logo-dark.png" alt="Waradly" height="38" /></a>
    <h1 class="page-title">Reset your password</h1>
    <p id="error" class="error-text mb-4" style="display:none;"></p>
    <p id="success" class="success-text mb-4" style="display:none;">Your password has been reset. <a href="/login.html">Log in</a>.</p>
    <form id="form">
      <label class="field"><span>New password</span><input class="input" type="password" id="new_password" required /></label>
      <button class="btn-primary w-full" type="submit" id="submit-btn">Reset password</button>
    </form>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    const token = Waradly.qs('token') || Waradly.qs('oobCode');
    if (!token) Waradly.showError('error', new Error('This link is invalid or has expired.'));

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      Waradly.clearError('error');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        await Waradly.api('/api/auth/password-reset', { method: 'POST', body: { token, new_password: document.getElementById('new_password').value } });
        document.getElementById('success').style.display = 'block';
        document.getElementById('form').style.display = 'none';
      } catch (err) {
        Waradly.showError('error', err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
