<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RFQ — Waradly</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
</head>
<body>
  <div class="shell">
    <div id="sidebar-slot"></div>
    <main class="content">
      <div class="page-wide" style="max-width:640px;">
        <div id="content">Loading…</div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/util.js"></script>
  <script>
    (async () => {
      const user = await Waradly.requireRole('supplier');
      if (!user) return;
      Waradly.mountShell(user, '/supplier/rfqs.html');

      const rfqId = Waradly.qs('id');
      const { rfq } = await Waradly.api(`/api/rfqs/${rfqId}`);
      const canOffer = ['PUBLISHED', 'RECEIVING_OFFERS'].includes(rfq.status);

      document.getElementById('content').innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h1 class="page-title" style="margin:0;">${Waradly.escapeHtml(rfq.title)}</h1>
          <span class="badge">${rfq.status}</span>
        </div>
        <div class="card">
          <p><strong>Buyer:</strong> ${Waradly.escapeHtml(rfq.buyer_display_name || 'Buyer')} (${Waradly.escapeHtml(rfq.buyer_general_region || '—')})</p>
          <p><strong>Category:</strong> ${Waradly.escapeHtml(rfq.category_name || '—')}</p>
          <p><strong>Quantity:</strong> ${rfq.quantity ?? '—'} ${Waradly.escapeHtml(rfq.unit || '')}</p>
          <p><strong>Delivery region:</strong> ${Waradly.escapeHtml(rfq.delivery_region || '—')}</p>
          <p><strong>Delivery deadline:</strong> ${Waradly.formatDate(rfq.delivery_deadline)}</p>
          <p><strong>Offer deadline:</strong> ${Waradly.formatDate(rfq.offer_deadline_at)}</p>
          <p><strong>Sample required:</strong> ${rfq.sample_required ? 'Yes' : 'No'}</p>
          ${rfq.quality_requirements ? `<p><strong>Quality requirements:</strong> ${Waradly.escapeHtml(rfq.quality_requirements)}</p>` : ''}
        </div>
        ${rfq.items && rfq.items.length ? `<div class="card"><h3 style="margin-top:0;">Items</h3>
          <table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th></tr></thead><tbody>
            ${rfq.items.map((i) => `<tr><td>${Waradly.escapeHtml(i.item_name)}</td><td>${i.quantity}</td><td>${Waradly.escapeHtml(i.unit)}</td></tr>`).join('')}
          </tbody></table></div>` : ''}
        ${canOffer ? `<a class="btn-primary" href="/supplier/offer-form.html?rfq_id=${rfqId}">Submit an offer</a>` : ''}
      `;
    })();
  </script>
</body>
</html>
